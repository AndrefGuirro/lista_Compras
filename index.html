<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="imagens/icon-192.png" type="image/png" />
  <meta name="theme-color" content="#0d6efd" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      padding: 1rem;
      background-color: #f2f2f2;
    }

    .comprado {
      text-decoration: line-through;
      color: gray;
    }

    .app-container {
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1 class="text-center mb-4">🛒 Lista de Compras</h1>

    <div class="input-group mb-3">
      <input type="text" id="produtoInput" class="form-control" placeholder="Digite um produto" />
      <button class="btn btn-primary" onclick="adicionarProduto()">
        <i class="bi bi-plus-circle"></i> Adicionar
      </button>
    </div>

    <div class="list-group-item d-flex fw-bold text-white" style="background-color: #0d6efd;">
      <div class="me-2" style="width: 90px;">Comprado</div>
      <div class="flex-grow-1">Produto</div>
      <div style="width: 100px;">Preço</div>
    </div>

    <ul id="listaProdutos" class="list-group mb-3"></ul>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <strong>Total: R$ <span id="totalCompra">0.00</span></strong>
      <button class="btn btn-danger btn-sm" onclick="limparLista()">
        <i class="bi bi-trash"></i> Limpar lista
      </button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ Service Worker registrado com sucesso!'))
        .catch(error => console.log('❌ Falha ao registrar o Service Worker:', error));
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
