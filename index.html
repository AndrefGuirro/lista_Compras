<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Manifesto -->
  <link rel="manifest" href="/lista_Compras/manifest.json">


<!-- Ícone para a tela inicial -->
<link rel="icon" sizes="192x192" href="imagens/logoCompra192.png">

<!-- Cor da barra do topo no celular -->
<meta name="theme-color" content="#0d6efd">

  <style>
    .comprado {
      text-decoration: line-through;
      color: gray;
    }
  </style>

</head>


<body class="p-3">

  <h2 class="text-center">🛒 Lista de Compras</h2>

  <div class="input-group mb-3">
    <input type="text" id="produtoInput" class="form-control" placeholder="Adicionar produto na lista">

    <button class="btn btn-primary" onclick="adicionarProduto()">Adicionar</button>
  </div>

  <div class="row fw-bold text-center border-bottom pb-2 mb-2">
    <div class="col-2">✓</div>
    <div class="col-6">Produto</div>
    <div class="col-4">Preço (R$)</div>
  </div>
  
  <ul class="list-group" id="listaProdutos"></ul>
  

  <ul class="list-group" id="listaProdutos"></ul>

  <div class="mt-3">
    <h4>Total: R$ <span id="totalCompra">0.00</span></h4>
  </div>

  <button class="btn btn-danger mt-3 w-100" onclick="limparLista()">🗑️ Limpar Lista</button>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker registrado!'))
        .catch(error => console.log('Erro ao registrar o SW:', error));
    }
  </script>
  
</body>
</html>
