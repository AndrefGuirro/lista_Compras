<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lista de Compras</h1>

    <form id="form-item" class="form-add">
      <input type="text" id="input-item" placeholder="Novo produto..." required autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <div class="table-container">
      <div class="list-header">
        <div class="col-check">✓</div>
        <div class="col-nome">Produto</div>
        <div class="col-qtd">Qtd</div>
        <div class="col-preco">Preço</div>
        <div class="col-acoes"></div>
      </div>

      <ul id="lista-compras" class="item-list">
        <!-- Itens via app.js -->
      </ul>
    </div>

    <div class="total-container">
      <span>Total:</span>
      <strong id="valor-total">R$ 0,00</strong>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
